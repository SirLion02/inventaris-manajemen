<div class="page-body">
    <div class="cat-header">
        <div class="cat-header-left">
            <h1>Kategori</h1>
            <div class="subtitle">{{len .}} kategori terdaftar</div>
        </div>
        <button class="btn-add-cat">
            <i class="ti ti-plus"></i> Tambah Kategori
        </button>
    </div>

    <div class="cat-toolbar">
        <div class="cat-search">
            <i class="ti ti-search"></i>
            <span>Cari kategori...</span>
        </div>
        <div class="cat-filter">
            <i class="ti ti-filter"></i>
            <span>Filter</span>
        </div>
    </div>

    <div class="cat-table-card">
        <table class="cat-table">
            <thead>
                <tr>
                    <th style="width: 60%">Nama Kategori</th>
                    <th style="width: 30%">Jumlah Produk</th>
                    <th style="width: 10%">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {{range .}}
                <tr>
                    <td>
                        <span class="cat-name">{{.Name}}</span>
                    </td>
                    <td>{{.ProductCount}} produk</td>
                    <td>
                        <div class="cat-actions">
                            <button class="action-btn edit">
                                <i class="ti ti-edit"></i>
                            </button>
                            <button class="action-btn delete">
                                <i class="ti ti-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
        <div class="cat-pagination">
            <span class="pagination-info"
                >Menampilkan 1–5 dari 12 kategori</span
            >
            <div class="pagination-btns">
                <button class="page-btn">
                    <i class="ti ti-chevron-left"></i>
                </button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">
                    <i class="ti ti-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
