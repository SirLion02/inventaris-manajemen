<div class="page-body">
    <div class="sup-header">
        <div class="sup-header-left">
            <h1>Supplier</h1>
            <div class="subtitle">{{len .}} supplier terdaftar</div>
        </div>
        <button class="btn-add-sup">
            <i class="ti ti-plus"></i> Tambah Supplier
        </button>
    </div>

    <div class="sup-toolbar">
        <div class="sup-search">
            <i class="ti ti-search"></i>
            <span>Cari supplier...</span>
        </div>
        <div class="sup-filter">
            <i class="ti ti-filter"></i>
            <span>Filter</span>
        </div>
    </div>

    <div class="sup-table-card">
        <table class="sup-table">
            <thead>
                <tr>
                    <th style="width: 30%">Nama Supplier</th>
                    <th style="width: 30%">Alamat / Kontak</th>
                    <th style="width: 20%">Telepon</th>
                    <th style="width: 20%">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {{range .}}
                <tr>
                    <td>
                        <span class="sup-name">{{.Name}}</span>
                    </td>
                    <td>{{.Address}}</td>
                    <td>{{.Contact}}</td>
                    <td>
                        <div class="sup-actions">
                            <button class="action-btn edit">
                                <i class="ti ti-edit"></i>
                            </button>
                            <button class="action-btn delete">
                                <i class="ti ti-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
        <div class="sup-pagination">
            <span class="pagination-info">Menampilkan 1–5 dari 8 supplier</span>
            <div class="pagination-btns">
                <button class="page-btn">
                    <i class="ti ti-chevron-left"></i>
                </button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">
                    <i class="ti ti-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
