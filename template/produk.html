<div class="page-body">
    <div class="prod-header">
        <div class="prod-header-left">
            <h1>Produk</h1>
            <div class="subtitle">{{len .}} item terdaftar</div>
        </div>
        <button class="btn-add-prod">
            <i class="ti ti-plus"></i> Tambah Produk
        </button>
    </div>

    <div class="prod-toolbar">
        <div class="prod-search">
            <i class="ti ti-search"></i>
            <span>Cari produk...</span>
        </div>
        <div class="prod-filter">
            <i class="ti ti-filter"></i>
            <span>Filter</span>
        </div>
    </div>

    <div class="prod-table-card">
        <table class="prod-table">
            <thead>
                <tr>
                    <th style="width: 26%">Nama Produk</th>
                    <th style="width: 14%">Kategori</th>
                    <th style="width: 15%">Harga Beli</th>
                    <th style="width: 15%">Harga Jual</th>
                    <th style="width: 10%">Stok</th>
                    <th style="width: 20%">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {{range .}}
                <tr>
                    <td>
                        <span class="prod-name">{{.Name}}</span>
                        <span class="prod-sku">{{.SKU}}</span>
                    </td>
                    <td><span class="cat-badge">{{.Category}}</span></td>
                    <td>{{formatCurrency .PriceBuy}}</td>
                    <td>{{formatCurrency .PriceSell}}</td>
                    <td class="{{if lt .Stock 10}}stock-low{{end}}">
                        {{.Stock}}
                    </td>
                    <td>
                        <div class="prod-actions">
                            <button class="action-btn edit">
                                <i class="ti ti-edit"></i>
                            </button>
                            <button class="action-btn delete">
                                <i class="ti ti-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
        <div class="prod-pagination">
            <span class="pagination-info">Menampilkan 1–5 dari 248 produk</span>
            <div class="pagination-btns">
                <button class="page-btn">
                    <i class="ti ti-chevron-left"></i>
                </button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>
                <button class="page-btn">
                    <i class="ti ti-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
