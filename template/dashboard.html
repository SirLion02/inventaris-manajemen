<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inventaris - Dashboard</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
        />
        <link rel="stylesheet" href="/static/template/style.css" />
        <script
            src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
            integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
            crossorigin="anonymous"
        ></script>
    </head>
    <body class="dashboard-page">
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="ti ti-package"></i>
                <span>Inventaris</span>
            </div>
            <div class="nav-section">
                <div class="nav-label">MENU</div>
                <ul class="nav-menu">
                    <li
                        class="nav-item"
                        hx-get="/partial?page=dashboard-content"
                        hx-target="#content-area"
                        hx-swap="innerHTML"
                        hx-on:click="document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));this.classList.add('active')"
                    >
                        <i class="ti ti-layout-dashboard"></i> Dashboard
                    </li>
                    <li
                        class="nav-item"
                        hx-get="/partial?page=produk"
                        hx-target="#content-area"
                        hx-swap="innerHTML"
                        hx-on:click="document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));this.classList.add('active')"
                    >
                        <i class="ti ti-box"></i> Produk
                    </li>
                    <li class="nav-item" data-page="kategori">
                        <i class="ti ti-tag"></i> Kategori
                    </li>
                    <li class="nav-item" data-page="stok">
                        <i class="ti ti-arrows-exchange"></i> Stok
                    </li>
                    <li class="nav-item" data-page="supplier">
                        <i class="ti ti-truck"></i> Supplier
                    </li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <div class="avatar-container">
                    <div class="avatar" id="avatarBtn">LA</div>
                    <div class="avatar-dropdown" id="avatarDropdown">
                        <div class="user-info">
                            <span class="user-name">Lion</span>
                            <span class="user-role">Administrator</span>
                        </div>
                        <div class="divider"></div>
                        <a href="login" class="dropdown-item logout">
                            <i class="ti ti-logout"></i> Keluar
                        </a>
                    </div>
                </div>
            </div>

            <!-- #content-area auto load saat buka -->
            <div
                id="content-area"
                hx-get="/partial?page=dashboard-content"
                hx-trigger="load"
                hx-swap="innerHTML"
            ></div>
        </div>

        <script>
            const avatarBtn = document.getElementById("avatarBtn");
            const avatarDropdown = document.getElementById("avatarDropdown");

            avatarBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                avatarDropdown.classList.toggle("show");
            });

            document.addEventListener("click", (e) => {
                if (
                    !avatarDropdown.contains(e.target) &&
                    e.target !== avatarBtn
                ) {
                    avatarDropdown.classList.remove("show");
                }
            });

            window.addEventListener("click", (e) => {
                if (
                    !avatarDropdown.contains(e.target) &&
                    e.target !== avatarBtn
                ) {
                    avatarDropdown.classList.remove("show");
                }
            });
        </script>
    </body>
</html>
