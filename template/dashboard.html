<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inventaris - Dashboard</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
        />
        <link rel="stylesheet" href="/static/template/style.css" />
    </head>
    <body class="dashboard-page">
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="ti ti-package"></i>
                <span>Inventaris</span>
            </div>
            <div class="nav-section">
                <div class="nav-label">MENU</div>
                <ul class="nav-menu">
                    <li class="nav-item active" data-page="dashboard-content">
                        <i class="ti ti-layout-dashboard"></i> Dashboard
                    </li>
                    <li class="nav-item" data-page="produk">
                        <i class="ti ti-box"></i> Produk
                    </li>
                    <li class="nav-item" data-page="kategori">
                        <i class="ti ti-tag"></i> Kategori
                    </li>
                    <li class="nav-item" data-page="stok">
                        <i class="ti ti-arrows-exchange"></i> Stok
                    </li>
                    <li class="nav-item" data-page="supplier">
                        <i class="ti ti-truck"></i> Supplier
                    </li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <div class="avatar-container">
                    <div class="avatar" id="avatarBtn">LA</div>
                    <div class="avatar-dropdown" id="avatarDropdown">
                        <div class="user-info">
                            <span class="user-name">Lion</span>
                            <span class="user-role">Administrator</span>
                        </div>
                        <div class="divider"></div>
                        <a href="login" class="dropdown-item logout">
                            <i class="ti ti-logout"></i> Keluar
                        </a>
                    </div>
                </div>
            </div>

            <div id="content-area"></div>
        </div>

        <script>
            const avatarBtn = document.getElementById("avatarBtn");
            const avatarDropdown = document.getElementById("avatarDropdown");

            avatarBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                avatarDropdown.classList.toggle("show");
            });

            document.addEventListener("click", (e) => {
                if (
                    !avatarDropdown.contains(e.target) &&
                    e.target !== avatarBtn
                ) {
                    avatarDropdown.classList.remove("show");
                }
            });

            window.addEventListener("click", (e) => {
                if (
                    !avatarDropdown.contains(e.target) &&
                    e.target !== avatarBtn
                ) {
                    avatarDropdown.classList.remove("show");
                }
            });
        </script>

        <script>
            // Ambil semua elemen nav-item
            const navItems = document.querySelectorAll(".nav-item");
            const contentArea = document.getElementById("content-area");

            // Fungsi untuk load konten
            async function loadPage(pageName) {
                try {
                    // Request ke backend: /partial?page=produk
                    const response = await fetch(`/partial?page=${pageName}`);
                    if (!response.ok)
                        throw new Error("Halaman tidak ditemukan");

                    const html = await response.text();

                    // Masukkan HTML yang diterima ke dalam content-area
                    contentArea.innerHTML = html;
                } catch (error) {
                    contentArea.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
                }
            }

            // Tambahkan event listener ke setiap menu
            navItems.forEach((item) => {
                item.addEventListener("click", function () {
                    // 1. Hapus class active dari semua menu, tambahkan ke yang diklik
                    navItems.forEach((i) => i.classList.remove("active"));
                    this.classList.add("active");

                    // 2. Ambil nama page dari attribute data-page
                    const page = this.getAttribute("data-page");

                    // 3. Load kontennya
                    loadPage(page);
                });
            });

            // Load halaman default saat pertama kali dibuka
            window.addEventListener("DOMContentLoaded", () => {
                loadPage("dashboard-content");
            });
        </script>
    </body>
</html>
