<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inventaris - Dashboard</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
        />
        <link rel="stylesheet" href="/static/template/style.css" />
    </head>
    <body class="dashboard-page">
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="ti ti-package"></i>
                <span>Inventaris</span>
            </div>
            <div class="nav-section">
                <div class="nav-label">MENU</div>
                <ul class="nav-menu">
                    <li class="nav-item active">
                        <i class="ti ti-layout-dashboard"></i> Dashboard
                    </li>
                    <li class="nav-item"><i class="ti ti-box"></i> Produk</li>
                    <li class="nav-item"><i class="ti ti-tag"></i> Kategori</li>
                    <li class="nav-item">
                        <i class="ti ti-arrows-exchange"></i> Stok
                    </li>
                    <li class="nav-item">
                        <i class="ti ti-truck"></i> Supplier
                    </li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <div class="avatar-container">
                    <div class="avatar" id="avatarBtn">LA</div>
                    <div class="avatar-dropdown" id="avatarDropdown">
                        <div class="user-info">
                            <span class="user-name">Lion</span>
                            <span class="user-role">Administrator</span>
                        </div>
                        <div class="divider"></div>
                        <a href="login" class="dropdown-item logout">
                            <i class="ti ti-logout"></i> Keluar
                        </a>
                    </div>
                </div>
            </div>

            <div class="page-body">
                <h1 class="page-title">Dashboard</h1>
                <p class="page-subtitle">Selamat datang kembali, Lion</p>
                <p class="placeholder-text">Konten belum tersedia.</p>
            </div>
        </div>

        <script>
            const avatarBtn = document.getElementById("avatarBtn");
            const avatarDropdown = document.getElementById("avatarDropdown");

            avatarBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                avatarDropdown.classList.toggle("show");
            });

            document.addEventListener("click", (e) => {
                if (
                    !avatarDropdown.contains(e.target) &&
                    e.target !== avatarBtn
                ) {
                    avatarDropdown.classList.remove("show");
                }
            });

            window.addEventListener("click", (e) => {
                if (
                    !avatarDropdown.contains(e.target) &&
                    e.target !== avatarBtn
                ) {
                    avatarDropdown.classList.remove("show");
                }
            });
        </script>
    </body>
</html>
